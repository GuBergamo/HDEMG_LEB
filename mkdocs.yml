site_name: Pesquisa EMG
theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.expand
    - search.suggest

# Aqui ligamos as caixas expansíveis nativas
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Início: index.md
  - 📚 Núcleo de Decomposição:
      - Foco Decomposição: foco_decomposicao.md
      - Algoritmos e Códigos: algoritmos_codigos.md
  - 🧪 Validações e Dados: validacoes_dados.md
  - 📂 Outros Projetos e Extras: analises_extras.md
