site_name: Pesquisa EMG
theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.expand
    - search.suggest

# Aqui ligamos as caixas expansíveis nativas
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Início: index.md
  - Foco Decomposição: foco_decomposicao.md
